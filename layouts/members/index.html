{{ define "main" }}
<h1 class="title">{{ partial "svg" "members" }}{{ .Title}}</h1>
<div class="content members-section" data-members-root data-members-api="https://members.ouw.s23.moe/v1/members">
  <p class="members-sync-status" data-members-status aria-live="polite">Loading current members…</p>
  <div class="members members-loading" data-members-loading aria-hidden="true">
    {{ range seq 12 }}
      <div class="member member-loading-card">
        <span class="member-loading-avatar"></span>
        <span class="member-loading-copy">
          <span class="member-loading-line member-loading-name"></span>
          <span class="member-loading-line"></span>
          <span class="member-loading-line member-loading-short"></span>
        </span>
      </div>
    {{ end }}
  </div>

  <div data-members-content hidden>
    <h2>Executives</h2>
    <div class="members members-executives" data-members-category="executive"></div>

    <h2>Members</h2>
    <div class="members members-members" data-members-category="member"></div>

    <h2>Alumni</h2>
    <div class="members members-alumni" data-members-category="alumni"></div>
  </div>
  <template data-member-icons>
    <span data-icon="discord">{{ partial "svg" "filled-discord" }}</span>
    <span data-icon="website">{{ partial "svg" "website" }}</span>
    <span data-icon="github">{{ partial "svg" "github" }}</span>
    <span data-icon="twitch">{{ partial "svg" "filled-twitch" }}</span>
    <span data-icon="youtube">{{ partial "svg" "filled-youtube" }}</span>
  </template>
</div>
{{ end }}
